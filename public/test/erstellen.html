<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raum erstellen – Pickr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/test/style.css">
</head>
<body>
<header class="topbar">
  <a class="topbar-brand" href="/test/index.html"><img src="/test/assets/logo/pickr-logo-transparent.png" alt="Pickr"></a>
  <nav class="topbar-links">
    <a href="/test/impressum.html">Impressum</a>
    <a href="/test/datenschutz.html">Datenschutz</a>
  </nav>
</header>

<main class="page">
  <section class="card">
    <a class="back-link" href="/test/index.html">&larr; Zurück</a>
    <h1>Raum erstellen</h1>
    <p>Lege einen neuen Entscheidungsraum an und teile den Code gleich mit deiner Gruppe.</p>

    <form id="erstellen-form">
      <label for="frage">
        Frage / Titel
        <input type="text" id="frage" name="frage" required placeholder="Was essen wir heute?">
      </label>

      <label for="name">
        Dein Name
        <input type="text" id="name" name="name" required placeholder="z. B. Anna">
      </label>

      <label for="ideen">
        Erste Ideen <span class="hinweis">(optional, eine pro Zeile)</span>
        <textarea id="ideen" name="ideen" placeholder="Pizza&#10;Sushi&#10;Burger"></textarea>
      </label>

      <p id="fehler" class="fehler" hidden></p>

      <button type="submit" class="btn btn-primary btn-big" id="erstellen-button">Raum erstellen</button>
    </form>
  </section>
</main>


<script src="/test/js/api.js"></script>
<script src="/test/js/erstellen.js"></script>
</body>
</html>
