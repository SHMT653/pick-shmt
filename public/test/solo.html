<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solo-Tools – Pickr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/test/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <a class="topbar-brand" href="/test/index.html"><img src="/test/assets/logo/pickr-logo-transparent.png" alt="Pickr"></a>
    <nav class="topbar-nav">
      <a href="/test/index.html">Home</a>
      <a href="/test/solo.html">Solo-Tools</a>
      <a id="mein-raum-link" class="mein-raum-link" href="/test/raum.html" hidden>Mein Raum</a>
    </nav>
  </div>
  <nav class="topbar-links">
    <a href="/test/impressum.html">Impressum</a>
    <a href="/test/datenschutz.html">Datenschutz</a>
  </nav>
</header>
<script src="/test/js/header.js"></script>

<main class="page">
  <section id="solo-auswahl" class="card">
    <a class="back-link" href="/test/index.html">&larr; Zurück</a>
    <h1>Solo-Tools</h1>
    <p>Kein Raum, kein Code nötig - wähle ein Tool:</p>
    <div class="modus-kacheln">
      <button type="button" class="modus-kachel" data-tool="wer-muss"><span class="modus-icon">🫵</span>Wer muss...?</button>
      <button type="button" class="modus-kachel" data-tool="muenze"><span class="modus-icon">🪙</span>Münzwurf</button>
    </div>
  </section>

  <section id="solo-wer-muss" class="card" hidden>
    <button type="button" class="back-link" data-action="zurueck">&larr; Zurück zur Auswahl</button>
    <h1>Wer muss...?</h1>
    <p>Alle legen gleichzeitig einen Finger auf das Feld.</p>

    <label for="solo-frage">
      Wer muss...?
      <input type="text" id="solo-frage" placeholder="z. B. Wer zahlt? / Wer holt Getränke?">
    </label>

    <div id="solo-finger-feld" class="finger-feld"></div>
    <p id="solo-finger-status" class="hinweis"></p>
    <button id="solo-finger-reset" class="btn btn-secondary btn-big" type="button" hidden>Nochmal</button>
  </section>

  <section id="solo-muenze" class="card" hidden>
    <button type="button" class="back-link" data-action="zurueck">&larr; Zurück zur Auswahl</button>
    <h1>Kopf oder Zahl?</h1>
    <p>Für die ganz schnellen Entscheidungen zwischendurch.</p>

    <div class="muenze-buehne">
      <div id="muenze" class="muenze">
        <div class="muenze-seite muenze-kopf">K</div>
        <div class="muenze-seite muenze-zahl">Z</div>
      </div>
    </div>

    <p id="muenze-ergebnis" class="ergebnis-text muenze-ergebnis"></p>
    <button id="muenze-werfen-button" class="btn btn-primary btn-big" type="button">Werfen</button>
  </section>
</main>

<script src="/test/js/solo.js"></script>
</body>
</html>
