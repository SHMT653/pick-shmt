<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raum beitreten – Pickr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/test/style.css">
</head>
<body>
<header class="topbar">
  <a class="topbar-brand" href="/test/index.html"><img src="/test/assets/logo/pickr-logo-transparent.png" alt="Pickr"></a>
  <nav class="topbar-links">
    <a href="/test/impressum.html">Impressum</a>
    <a href="/test/datenschutz.html">Datenschutz</a>
  </nav>
</header>

<main class="page">
  <section class="card">
    <a class="back-link" href="/test/index.html">&larr; Zurück</a>
    <h1>Raum beitreten</h1>
    <p>Gib den 6-stelligen Code ein, den du von der Gruppe bekommen hast.</p>

    <form id="beitreten-form">
      <label for="code">
        Raum-Code
        <input type="text" id="code" name="code" class="code-eingabe" required maxlength="6" placeholder="z. B. 7KFX2P">
      </label>

      <label for="name">
        Dein Name
        <input type="text" id="name" name="name" required placeholder="z. B. Ben">
      </label>

      <div id="ideen-feld" hidden>
        <label for="ideen">
          Deine Ideen <span class="hinweis">(optional, eine pro Zeile)</span>
          <textarea id="ideen" name="ideen" placeholder="Pizza&#10;Sushi"></textarea>
        </label>
      </div>

      <p id="fehler" class="fehler" hidden></p>

      <button type="submit" class="btn btn-primary btn-big" id="beitreten-button">Beitreten</button>
    </form>
  </section>
</main>


<script src="/test/js/api.js"></script>
<script src="/test/js/beitreten.js"></script>
</body>
</html>
